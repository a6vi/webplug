name: Build native libraries

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android Maven library
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Build and publish to runner's local Maven repository
        run: npx expo-brownfield build:android --release --repo MavenLocal
      - name: Upload Android Maven files
        uses: actions/upload-artifact@v6
        with:
          name: android-maven-library
          path: ~/.m2/repository/com/myski/
          if-no-files-found: error

  ios:
    name: iOS XCFrameworks
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Show Xcode version
        run: xcodebuild -version
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then npm ci; else npm install --no-audit --no-fund; fi
      - name: Generate iOS project and build XCFrameworks
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          npx expo prebuild --platform ios --clean
          test -d ios
          workspace="$(find ios -maxdepth 1 -name '*.xcworkspace' -print -quit)"
          if [ -z "$workspace" ]; then
            echo "No .xcworkspace was generated under $GITHUB_WORKSPACE/ios" >&2
            find ios -maxdepth 2 -print
            exit 1
          fi
          echo "Using iOS workspace: $workspace"
          npx expo-brownfield build:ios \
            --release \
            --xcworkspace "$workspace" \
            --artifacts "$GITHUB_WORKSPACE/artifacts" \
            --verbose
      - name: Upload iOS frameworks
        uses: actions/upload-artifact@v6
        with:
          name: ios-xcframeworks
          path: artifacts/
          if-no-files-found: error
